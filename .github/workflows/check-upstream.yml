name: Check upstream IEEE style

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: upstream-ieee-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Leave an existing update available for review
        id: pending
        run: |
          pending=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("upstream-ieee-"))] | length')
          echo "count=$pending" >> "$GITHUB_OUTPUT"
          if [ "$pending" != 0 ]; then
            echo 'An upstream update is already awaiting review; its branch will not be overwritten.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fetch only the upstream IEEE file at a known commit
        if: steps.pending.outputs.count == '0'
        id: upstream
        run: |
          sha=$(gh api repos/citation-style-language/styles/commits/master --jq '.sha')
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/citation-style-language/styles/$sha/ieee.csl" \
            -o "$RUNNER_TEMP/ieee.csl.upstream"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Prepare both variants for review
        if: steps.pending.outputs.count == '0'
        id: update
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: python scripts/update_upstream.py "$RUNNER_TEMP/ieee.csl.upstream" "$UPSTREAM_SHA"
      - name: Open an update pull request
        if: steps.update.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          HAS_CONFLICTS: ${{ steps.update.outputs.conflict }}
        run: |
          branch="upstream-ieee-${UPSTREAM_SHA:0:12}"
          if git ls-remote --exit-code --heads origin "$branch"; then
            echo "An update branch already exists: $branch. Reopen or resolve its pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ieee.csl ieee-no-collapse.csl .upstream-baseline
          if [ -d .upstream-review ]; then
            git add -f -- .upstream-review
          fi
          git commit -m "Update IEEE style from upstream ${UPSTREAM_SHA:0:12}"
          git push --set-upstream origin "$branch"
          body="$RUNNER_TEMP/upstream-pr.md"
          printf 'Update the IEEE style from [upstream commit %s](https://github.com/citation-style-language/styles/commit/%s).\n\n' "$UPSTREAM_SHA" "$UPSTREAM_SHA" > "$body"
          printf 'Both GTAPE variants are included. Review the diff and require the **Validate styles** check to pass before merging.\n' >> "$body"
          draft=()
          if [ "$HAS_CONFLICTS" = true ]; then
            draft=(--draft)
            printf '\nConflicts require manual resolution. See `.upstream-review/README.md`. The installable styles and accepted upstream baseline are unchanged; validation intentionally fails until resolution.\n' >> "$body"
          fi
          gh pr create --base master --head "$branch" --title 'Update IEEE style from upstream' --body-file "$body" "${draft[@]}"
          # Explicit dispatch runs validation on this branch even when the bot's
          # pull_request event requires approval or does not trigger automatically.
          gh workflow run validate.yml --ref "$branch"
      - name: Report unchanged upstream
        if: steps.update.outputs.changed == 'false'
        run: echo 'The upstream IEEE file has not changed.' >> "$GITHUB_STEP_SUMMARY"
