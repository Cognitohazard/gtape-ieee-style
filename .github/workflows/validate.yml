name: Validate citation styles

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate styles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - name: CSL 1.0.2 and macro validation
        run: python scripts/validate.py
      - name: Citation and bibliography examples
        run: npm test
      - name: Upstream update safety checks
        run: python -m unittest discover -s tests -p 'test_*.py' -v
